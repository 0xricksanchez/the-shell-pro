name: the-shell-pro-preview

services:
  database:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: preview-only-password
      MYSQL_ROOT_PASSWORD: preview-only-root-password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppreview-only-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - preview-database:/var/lib/mysql

  ghost:
    build:
      context: .
      dockerfile: Dockerfile.preview
    image: the-shell-pro-ghost-preview:local
    user: "node"
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: development
      url: http://localhost:2369
      privacy__useUpdateCheck: "false"
      # This local-only stack has no mail server. Never use this in production.
      security__staffDeviceVerification: "false"
      database__client: mysql
      database__connection__host: database
      database__connection__user: ghost
      database__connection__password: preview-only-password
      database__connection__database: ghost
    ports:
      - "127.0.0.1:2369:2368"
volumes:
  preview-database:
